packages:
  - apps/*
  - packages/*

# Scripts de build de dependências: só o que é necessário.
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  unrs-resolver: false

# Mantém o Vite numa versão fora da janela de "idade mínima de release" (supply-chain).
overrides:
  vite: ~8.3.2
  # Correções de segurança em dependências transitivas (pnpm audit):
  mysql2: '>=3.23.1'
  js-yaml: '>=5.4.1'
  deepmerge-ts: '>=8.0.0'
