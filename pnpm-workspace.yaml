packages:
  - apps/*
  - packages/*

# Scripts de build de dependências: só o que é necessário.
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  unrs-resolver: false

# Mantém o Vite numa versão fora da janela de "idade mínima de release" (supply-chain).
overrides:
  vite: ~8.3.2
